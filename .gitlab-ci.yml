unit:
  image: $PHP_IMAGE
  timeout: 15m
  parallel:
    matrix:
      - PHP_IMAGE:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
  script:
    - bash tools/ci.sh

# SSH and SFTP against OpenSSH started in the job container (tools/sshd/start.sh). The whole matrix: the code
# paths through phpseclib 2 differ between PHP versions (on 8.5 it triggers ord() deprecations of its own, which
# PHPUnit ignores as indirect; deprecations from src/ fail the job).
docker:
  image: $PHP_IMAGE
  timeout: 15m
  parallel:
    matrix:
      - PHP_IMAGE:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
  script:
    - bash tools/ci.sh --deps-only
    - bash tools/sshd/start.sh
    - vendor/bin/phpunit --group docker

# Lowest allowed version of every dependency: checks the lower bounds in composer.json (one PHP version is enough).
lowest:
  image: php:8.2.35-cli
  timeout: 15m
  script:
    - bash tools/ci.sh --prefer-lowest

chr:
  image: php:8.2.35-cli
  timeout: 20m
  variables:
    CHR_VERSION: "7.24.5"
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
  cache:
    key: chr-$CHR_VERSION
    paths:
      - .cache/chr
  script:
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop
